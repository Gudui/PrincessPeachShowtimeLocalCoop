name: Bug report
description: Report a reproducible Princess Peach Showtime Local Co-op problem
title: "[Bug] "
labels:
  - bug
  - alpha
body:
  - type: markdown
    attributes:
      value: |
        Read KNOWN_ISSUES.md and search existing issues first. Never attach copyrighted game files, keys, firmware, or unredacted personal data.
  - type: dropdown
    id: mod_version
    attributes:
      label: Mod version
      options:
        - v0.1.0-alpha.1
        - Self-built from main
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Ryujinx
        - Atmosphere / physical Switch (experimental)
    validations:
      required: true
  - type: input
    id: target_version
    attributes:
      label: Ryujinx or system version
      placeholder: Ryujinx version or Atmosphere/system version
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Princess Peach: Showtime! version
      description: Only version 1.0.0 (USA v0) is supported.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: controller_setup
    attributes:
      label: Controller setup
      description: Describe both configured controllers and when they were connected.
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Stage or play area
      placeholder: e.g. Swordfighter 1F, Cowgirl stage, Theater 1F
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Numbered steps starting from game launch.
      placeholder: |
        1. Start the game with two controllers connected...
        2. Enter stage...
        3. As P2...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: other_mods
    attributes:
      label: Other enabled mods or configuration changes
      description: State whether the issue still occurs with other mods disabled.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted log or crash information
      description: Paste relevant log lines. Remove personal paths or usernames.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and KNOWN_ISSUES.md.
          required: true
        - label: I have not attached copyrighted game files, keys, firmware, or unredacted personal data.
          required: true
