# Princess Peach Showtime Local Co-op settings
#
# This file is loaded from romfs/PShowCoop/settings.ini when Player 2's character
# is initialized or rebuilt during a scene transition.
#
# To modify settings: edit this file with your emulator closed, or change it and
# move to a different room/stage to reload it. No code rebuild is required.
# Unrecognized or out-of-range values are clamped to safe limits.

# Master switch for Player 2's visual tint. Setting this to 0 leaves P2 with
# the standard unmodified Peach appearance.
p2.tint.enabled=1

# Tint color emissive channels (Red, Green, Blue).
# Values are emissive multipliers clamped between 0.0 and 20.0.
# Default is cyan (R=0.0, G=1.0, B=1.0) for clear visual distinction.
#   cyan:   0.0 / 1.0 / 1.0
#   green:  0.0 / 1.0 / 0.0
#   yellow: 1.0 / 1.0 / 0.0
#   violet: 1.0 / 0.0 / 1.0
p2.tint.r=0.0
p2.tint.g=1.0
p2.tint.b=1.0

# Overall emissive strength (0.0 to 100.0). Higher values make Player 2 glow
# more distinctly in dark or bright stages.
p2.tint.intensity=8.0

# Engine material parameter names targeted for tinting.
p2.tint.color_param=EmissiveColor
p2.tint.intensity_param=emissive_Intensity

# Backstop interval (in tick cycles) to ensure tint re-application if an in-place
# actor rebuild occurs.
p2.tint.backstop_calls=1800

# --- Player 2 Distance Leash & Catch-up ---
#
# Snaps Player 2 back near Player 1 when the players become separated by too
# large a distance. Distances are in Unreal Engine world units.

# Initial spawn alignment threshold. Snaps P2 near P1 upon entering a new room.
p2.leash.spawn_distance=800.0

# Gameplay distance leash. If P2 exceeds this distance from P1 during gameplay,
# P2 is safely brought back to P1's location. Set to 0.0 to disable the leash.
p2.leash.distance=2200.0

# Cooldown between leash teleportations to avoid repeated snap loops.
p2.leash.cooldown_calls=120

# --- Startup Level Warp (Optional) ---
#
# Specific stage to warp into on boot (e.g. Fencer_A). Leave empty or set to
# Fencer_A for normal testing.
warp.target=Fencer_A
